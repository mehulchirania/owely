# Firebase App Hosting config for Owely (project owely-c6c51).
# App Hosting builds this Next.js app from the connected GitHub branch and
# serves SSR. Deployed URL: <backend>--owely-c6c51.<region>.hosted.app
#
# Public Firebase web config is inlined at build time, so these NEXT_PUBLIC_*
# vars must be available to the BUILD step. The Admin service-account key is a
# secret consumed at RUNTIME only — store it in Cloud Secret Manager and
# reference it here (see the commented block).

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: owely-c6c51
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: owely-c6c51.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: owely-c6c51.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "167116474777"
    availability:
      - BUILD
      - RUNTIME

  # Fill these after registering a Web app in the Firebase console.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: TODO_FROM_CONSOLE
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: TODO_FROM_CONSOLE
    availability:
      - BUILD
      - RUNTIME

  # Secret (do NOT inline). Create it once, then uncomment:
  #   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY
  # - variable: FIREBASE_SERVICE_ACCOUNT_KEY
  #   secret: FIREBASE_SERVICE_ACCOUNT_KEY
  #   availability:
  #     - RUNTIME
