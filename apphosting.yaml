# Firebase App Hosting config for Owely (project owely-c6c51).
# App Hosting builds this Next.js app from the connected GitHub branch and
# serves SSR. Deployed URL: <backend>--owely-c6c51.<region>.hosted.app
#
# Public Firebase web config is inlined at build time, so these NEXT_PUBLIC_*
# vars must be available to the BUILD step. Runtime secrets belong in Cloud
# Secret Manager and are referenced below. Receipt OCR also requires the Google
# Cloud Vision API to be enabled for the Firebase project/service account.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: owely-c6c51
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: owely-c6c51.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: owely-c6c51.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "167116474777"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCIsMxBa1ANxgZZ5lryRRWnekn9ECyEs7E
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:167116474777:web:443bc30ceef6d4442c2b08
    availability:
      - BUILD
      - RUNTIME

  # Secrets (do NOT inline). Create them once before deploying:
  #   firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY
  #   firebase apphosting:secrets:set CRON_SECRET
  #   firebase apphosting:secrets:set OWELY_ADMIN_USERNAME
  #   firebase apphosting:secrets:set OWELY_ADMIN_PASSWORD
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: OWELY_ADMIN_USERNAME
    secret: OWELY_ADMIN_USERNAME
    availability:
      - RUNTIME
  - variable: OWELY_ADMIN_PASSWORD
    secret: OWELY_ADMIN_PASSWORD
    availability:
      - RUNTIME
